# CI en cada push: nada de datos reales (viven fuera del repo), pero si todo lo
# que puede romperse sin datos: tipos de la web, sintaxis de los servicios y la
# validacion sobre una fixture minima.
name: ci
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: cd apps/web && npm ci && npx tsc --noEmit
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sintaxis de todos los servicios
        run: python3 tests/ci_checks.py
      - name: validacion rechaza fichero corrupto (fixture)
        run: |
          mkdir -p /tmp/fx/prices/en /tmp/fx/prices/ja
          echo corrupto > /tmp/fx/prices/en/prices_2020-01-01.jsonl.gz
          echo corrupto > /tmp/fx/prices/ja/prices_2020-01-01.jsonl.gz
          if PCP_DATA_DIR=/tmp/fx python3 services/pipeline/validate.py --day 2020-01-01; then
            echo "::error::la validacion acepto un fichero corrupto"; exit 1
          fi
